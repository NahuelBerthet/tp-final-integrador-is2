name: Continuous Integration (CI)

on:
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check code formatting (Black)
        run: uv run black --check .

      - name: Lint code (Ruff)
        run: uv run ruff check src tests

      - name: Check PEP 8 compliance (Ruff)
        run: uv run ruff check --select E,W .

      - name: Check PEP 257 docstring compliance (Ruff)
        run: uv run ruff check --select D .

      - name: Static type checking (Mypy)
        run: uv run mypy src tests

      - name: Static type checking (Pyright)
        run: uv run pyright src tests

      - name: Run Tests with Coverage Report
        run: uv run python -m pytest --cov=tp_final_integrador_is2 --cov-report=term-missing