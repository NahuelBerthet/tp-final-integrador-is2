site_name: TP_Final_Integrador_IS2
repo_url: https://github.com/NahuelBerthet/tp-final-integrador-is2
site_url: https://NahuelBerthet.github.io/tp-final-integrador-is2
site_description: Trabajo final de ingenieria de software 2
site_author: Nahuel Berthet
repo_name: NahuelBerthet/tp-final-integrador-is2
edit_uri: edit/main/docs/
copyright: Maintained by <a href="https://github.com/NahuelBerthet">Nahuel Berthet</a>.
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - License: license.md
theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: purple
  icon:
    repo: fontawesome/brands/github
plugins:
  - search
  - gh-admonitions
  - minify:
      minify_html: true
      htmlmin_opts:
        remove_comments: true
markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: true
      pygments_style: material
      noclasses: true
  - pymdownx.inlinehilite
  - pymdownx.emoji
  - admonition
